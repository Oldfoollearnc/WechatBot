<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#928dab"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="120" fill="#00d2ff" opacity="0.05"/>
  <circle cx="850" cy="200" r="80" fill="#928dab" opacity="0.06"/>
  <circle cx="100" cy="900" r="100" fill="#00d2ff" opacity="0.04"/>

  <!-- Header -->
  <text x="450" y="58" text-anchor="middle" fill="url(#headerGrad)" font-size="32" font-weight="bold" filter="url(#glow)">AI 编程前提准备指南</text>
  <text x="450" y="82" text-anchor="middle" fill="#666" font-size="13">节省 Token · 提高质量 · 高效协作</text>
  <line x1="150" y1="95" x2="750" y2="95" stroke="#00d2ff" stroke-width="1" opacity="0.3"/>

  <!-- ============ Section 1: 省 Token ============ -->
  <rect x="40" y="115" width="820" height="40" rx="8" fill="#00d2ff" opacity="0.15"/>
  <text x="60" y="141" fill="#00d2ff" font-size="18" font-weight="bold">💡 一、节省 Token</text>

  <!-- Card 1 -->
  <rect x="40" y="170" width="400" height="155" rx="12" fill="url(#card1)" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="65" cy="195" r="14" fill="#00d2ff" opacity="0.2"/>
  <text x="65" y="200" text-anchor="middle" fill="#00d2ff" font-size="14" font-weight="bold">1</text>
  <text x="90" y="200" fill="#e0e0e0" font-size="15" font-weight="bold">.claudeignore — 写对</text>
  <text x="60" y="225" fill="#aaa" font-size="12">排除构建产物和依赖目录</text>
  <rect x="60" y="235" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="70" y="253" fill="#8b949e" font-size="11" font-family="Consolas, monospace"># Build outputs</text>
  <text x="70" y="268" fill="#7ee787" font-size="11" font-family="Consolas, monospace">bin/  obj/  .vs/</text>
  <text x="70" y="283" fill="#8b949e" font-size="11" font-family="Consolas, monospace"># Dependencies</text>
  <text x="70" y="298" fill="#7ee787" font-size="11" font-family="Consolas, monospace">node_modules/  *.log</text>

  <!-- Card 2 -->
  <rect x="460" y="170" width="400" height="155" rx="12" fill="url(#card1)" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="485" cy="195" r="14" fill="#00d2ff" opacity="0.2"/>
  <text x="485" y="200" text-anchor="middle" fill="#00d2ff" font-size="14" font-weight="bold">2</text>
  <text x="510" y="200" fill="#e0e0e0" font-size="15" font-weight="bold">项目结构清晰</text>
  <text x="480" y="225" fill="#aaa" font-size="12">文件职责单一，模块化设计</text>
  <rect x="480" y="235" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="490" y="253" fill="#f97583" font-size="11" font-family="Consolas, monospace">❌ 2000行的 God Class</text>
  <text x="490" y="270" fill="#7ee787" font-size="11" font-family="Consolas, monospace">✅ 200行的单一职责文件</text>
  <text x="490" y="290" fill="#8b949e" font-size="11">读的上下文越精准 → Token越少</text>

  <!-- Card 3 -->
  <rect x="40" y="340" width="400" height="155" rx="12" fill="url(#card1)" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="65" cy="365" r="14" fill="#00d2ff" opacity="0.2"/>
  <text x="65" y="370" text-anchor="middle" fill="#00d2ff" font-size="14" font-weight="bold">3</text>
  <text x="90" y="370" fill="#e0e0e0" font-size="15" font-weight="bold">避免重复说明</text>
  <text x="60" y="395" fill="#aaa" font-size="12">稳定需求写进 CLAUDE.md，一次配置永久生效</text>
  <rect x="60" y="405" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="70" y="425" fill="#8b949e" font-size="11" font-family="Consolas, monospace"># CLAUDE.md</text>
  <text x="70" y="442" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">- 测试用 xUnit</text>
  <text x="70" y="459" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">- 异步必须加 CancellationToken</text>

  <!-- Card 4 -->
  <rect x="460" y="340" width="400" height="155" rx="12" fill="url(#card1)" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="485" cy="365" r="14" fill="#00d2ff" opacity="0.2"/>
  <text x="485" y="370" text-anchor="middle" fill="#00d2ff" font-size="14" font-weight="bold">4</text>
  <text x="510" y="370" fill="#e0e0e0" font-size="15" font-weight="bold">问题要具体</text>
  <text x="480" y="395" fill="#aaa" font-size="12">精确描述目标，避免大范围搜索</text>
  <rect x="480" y="405" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="490" y="425" fill="#f97583" font-size="11" font-family="Consolas, monospace">❌ "帮我优化这个项目"</text>
  <text x="490" y="445" fill="#7ee787" font-size="11" font-family="Consolas, monospace">✅ "DoWork方法响应慢，帮我优化"</text>
  <text x="490" y="465" fill="#8b949e" font-size="11">精准定位 → 省50%以上Token</text>

  <!-- ============ Section 2: 提高代码质量 ============ -->
  <rect x="40" y="515" width="820" height="40" rx="8" fill="#ff6b6b" opacity="0.15"/>
  <text x="60" y="541" fill="#ff6b6b" font-size="18" font-weight="bold">🎯 二、提高代码质量</text>

  <!-- Card 5 -->
  <rect x="40" y="570" width="400" height="155" rx="12" fill="url(#card1)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="65" cy="595" r="14" fill="#ff6b6b" opacity="0.2"/>
  <text x="65" y="600" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">1</text>
  <text x="90" y="600" fill="#e0e0e0" font-size="15" font-weight="bold">.editorconfig — 统一风格</text>
  <text x="60" y="625" fill="#aaa" font-size="12">所有编辑器输出格式一致</text>
  <rect x="60" y="635" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="70" y="653" fill="#8b949e" font-size="11" font-family="Consolas, monospace">[*]</text>
  <text x="70" y="668" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">indent_style = space</text>
  <text x="70" y="683" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">indent_size = 4</text>
  <text x="70" y="698" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">end_of_line = crlf</text>

  <!-- Card 6 -->
  <rect x="460" y="570" width="400" height="155" rx="12" fill="url(#card1)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="485" cy="595" r="14" fill="#ff6b6b" opacity="0.2"/>
  <text x="485" y="600" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">2</text>
  <text x="510" y="600" fill="#e0e0e0" font-size="15" font-weight="bold">CLAUDE.md — 技术约束</text>
  <text x="480" y="625" fill="#aaa" font-size="12">写清技术栈、代码规范、架构边界</text>
  <rect x="480" y="635" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="490" y="653" fill="#8b949e" font-size="11" font-family="Consolas, monospace"># 技术栈</text>
  <text x="490" y="668" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">.NET 8, WPF, Dapper</text>
  <text x="490" y="683" fill="#8b949e" font-size="11" font-family="Consolas, monospace"># 规范</text>
  <text x="490" y="698" fill="#79c0ff" font-size="11" font-family="Consolas, monospace">PascalCase公共 / _camelCase私有</text>

  <!-- Card 7 -->
  <rect x="40" y="740" width="400" height="155" rx="12" fill="url(#card1)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="65" cy="765" r="14" fill="#ff6b6b" opacity="0.2"/>
  <text x="65" y="770" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">3</text>
  <text x="90" y="770" fill="#e0e0e0" font-size="15" font-weight="bold">测试先行</text>
  <text x="60" y="795" fill="#aaa" font-size="12">先写测试再写代码，改完立刻验证</text>
  <rect x="60" y="805" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="70" y="825" fill="#e6db74" font-size="11" font-family="Consolas, monospace">[Fact]</text>
  <text x="70" y="840" fill="#7ee787" font-size="11" font-family="Consolas, monospace">public void DoWork_ShouldComplete()</text>
  <text x="70" y="855" fill="#8b949e" font-size="11" font-family="Consolas, monospace">// 有测试 → 改代码不怕改出bug</text>

  <!-- Card 8 -->
  <rect x="460" y="740" width="400" height="155" rx="12" fill="url(#card1)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <circle cx="485" cy="765" r="14" fill="#ff6b6b" opacity="0.2"/>
  <text x="485" y="770" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">4</text>
  <text x="510" y="770" fill="#e0e0e0" font-size="15" font-weight="bold">小步提交</text>
  <text x="480" y="795" fill="#aaa" font-size="12">一次改一个小功能，改动越小出错越少</text>
  <rect x="480" y="805" width="360" height="75" rx="6" fill="#0d1117"/>
  <text x="490" y="825" fill="#f97583" font-size="11" font-family="Consolas, monospace">❌ "把整个项目重构了"</text>
  <text x="490" y="845" fill="#7ee787" font-size="11" font-family="Consolas, monospace">✅ "重构 AutomationEngine"</text>
  <text x="490" y="865" fill="#8b949e" font-size="11">范围小 → 出错少 → Review容易</text>

  <!-- ============ File Checklist ============ -->
  <rect x="40" y="915" width="820" height="40" rx="8" fill="#ffd93d" opacity="0.15"/>
  <text x="60" y="941" fill="#ffd93d" font-size="18" font-weight="bold">📁 三、必备文件清单</text>

  <rect x="40" y="970" width="190" height="90" rx="10" fill="url(#card1)" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <text x="135" y="1000" text-anchor="middle" fill="#00d2ff" font-size="24">📄</text>
  <text x="135" y="1025" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">CLAUDE.md</text>
  <text x="135" y="1045" text-anchor="middle" fill="#888" font-size="10">AI行为约束</text>

  <rect x="250" y="970" width="190" height="90" rx="10" fill="url(#card1)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <text x="345" y="1000" text-anchor="middle" fill="#ff6b6b" font-size="24">⚙️</text>
  <text x="345" y="1025" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">.editorconfig</text>
  <text x="345" y="1045" text-anchor="middle" fill="#888" font-size="10">编辑器统一配置</text>

  <rect x="460" y="970" width="190" height="90" rx="10" fill="url(#card1)" stroke="#ffd93d" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <text x="555" y="1000" text-anchor="middle" fill="#ffd93d" font-size="24">🚫</text>
  <text x="555" y="1025" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">.claudeignore</text>
  <text x="555" y="1045" text-anchor="middle" fill="#888" font-size="10">排除无关文件</text>

  <rect x="670" y="970" width="190" height="90" rx="10" fill="url(#card1)" stroke="#7ee787" stroke-width="1" stroke-opacity="0.3" filter="url(#shadow)"/>
  <text x="765" y="1000" text-anchor="middle" fill="#7ee787" font-size="24">🧪</text>
  <text x="765" y="1025" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">测试文件</text>
  <text x="765" y="1045" text-anchor="middle" fill="#888" font-size="10">质量保障基石</text>
</svg>